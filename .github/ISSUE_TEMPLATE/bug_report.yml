name: Bug report
description: Something doesn't work, crashes, or behaves differently than the README says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! If the problem is a *bad generated message* rather than a crash,
        the "Bad generated message" template fits better.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        I ran `verbatim gen` with a staged change and ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `git add src/foo.ts`
        2. `verbatim gen`
        3. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or error
      description: Paste the terminal output. It's formatted as code automatically.
      render: shell
  - type: input
    id: version
    attributes:
      label: verbatim version
      description: Output of `verbatim --version`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: "v24.1.0"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Ollama model
      description: The `model` from your config, and `ollama --version` if relevant.
      placeholder: "qwen2.5-coder:7b"
  - type: input
    id: git-client
    attributes:
      label: Git client (if the hook is involved)
      description: Terminal git, or a GUI client like VS Code, GitHub Desktop, or a JetBrains IDE.
      placeholder: "terminal git 2.47"
