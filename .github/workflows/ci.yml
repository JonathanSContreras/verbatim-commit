name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 18 is the floor `engines` promises; 24 and 26 are the current LTS lines.
        node: [18, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `prepare` runs the build, so this also checks that `npm install` works.
      - run: npm ci

      - run: npm test

      # The parts unit tests can't reach: the `verbatim` bin shim (npm's .cmd
      # wrapper on Windows) and the commit-msg hook, which git runs through
      # sh. No Ollama is needed: the heuristic pass runs alone, and with no
      # terminal attached a flagged message prints its warning and proceeds.
      - name: Smoke test the CLI and commit-msg hook
        shell: bash
        timeout-minutes: 3
        run: |
          npm link
          verbatim --version
          verbatim gen --help

          repo="$RUNNER_TEMP/hook-smoke"
          git init -q "$repo" && cd "$repo"
          git config user.email ci@example.com
          git config user.name CI
          verbatim install-hook

          echo one > a.txt && git add a.txt
          git commit -q -m "Add the first sample file for the hook test"

          echo two > b.txt && git add b.txt
          git commit -m "wip" < /dev/null 2> hook.err || { cat hook.err; exit 1; }
          cat hook.err
          grep -q "looks weak" hook.err
          test "$(git log -1 --format=%s)" = "wip"
